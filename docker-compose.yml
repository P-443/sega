# Local development ONLY — provides a PostgreSQL database.
# In production (Coolify) PostgreSQL is a separate managed service.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: sega
      POSTGRES_PASSWORD: sega
      POSTGRES_DB: sega
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U sega -d sega']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
